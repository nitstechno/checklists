# /etc/nginx/conf.d/checklists.conf  — separate from your existing site's config.
# Replace checklists.domain.demo with your host. One host serves every center: /<slug>

limit_req_zone $binary_remote_addr zone=cl_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name checklists.domain.demo;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;            # nginx >= 1.25.1: also add the line  http2 on;
    listen [::]:443 ssl;
    server_name checklists.domain.demo;

    ssl_certificate     /etc/letsencrypt/live/checklists.domain.demo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checklists.domain.demo/privkey.pem;

    root /var/www/checklists/current;      # frontend, symlink switched by the pipeline
    index index.html;
    client_max_body_size 6m;               # uploads are limited to 5 MB by the API

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types application/json text/css application/javascript;

    # API (FastAPI container listens on 127.0.0.1:8100)
    location = /api/auth/login {
        limit_req zone=cl_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Uploaded logos, images, PDFs (written by the API, served directly by nginx)
    location /files/ {
        alias /srv/checklists/uploads/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }

    # Single-page app: /<slug> and everything else -> index.html
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
